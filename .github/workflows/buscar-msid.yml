name: buscar-msid

# HERRAMIENTA DE UN SOLO USO (recreada agosto 2026).
# Ejecuta buscar_msid.py, que lee los ISINs de FUNDS en build_history_fondos.py
# y busca el SecId de Morningstar de cada fondo. Sube el resultado en msid.json.
# Lanzar a mano DESPUES de subir el build_history_fondos.py con los 14 fondos nuevos.
# Cuando el mapa este integrado en fondos.html, borrar este workflow y msid.json.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Buscar SecIds de Morningstar
        run: python buscar_msid.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add msid.json
          git diff --staged --quiet || git commit -m "msid.json con los SecIds de Morningstar"
          git push
